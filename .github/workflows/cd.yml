name: CD - Build, Push, Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: langgraphragacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -f infra/docker/Dockerfile -t langgraphragacr.azurecr.io/langgraph-rag-agent:${{ steps.vars.outputs.tag }} .
          docker push langgraphragacr.azurecr.io/langgraph-rag-agent:${{ steps.vars.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name langgraph-rag-agent \
            --resource-group langgraph-rag-rg \
            --image langgraphragacr.azurecr.io/langgraph-rag-agent:${{ needs.build-and-push.outputs.image_tag }}