# --------------------------------------------------------------------------
# ci.yml
#
# Continuous Integration stub. Runs on every push/PR: install deps, lint,
# run unit + integration tests (all against STUB implementations, so no
# API keys/secrets are needed for CI to pass at this stage).
#
# TODO (later session): add a second workflow (cd.yml) for build+push
# container image + deploy, gated behind an approval-gate environment
# (our future "Approval Gates" exercise).
# --------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -v
